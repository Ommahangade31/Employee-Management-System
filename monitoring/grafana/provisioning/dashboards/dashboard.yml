# Grafana Dashboard Provisioning
# Tells Grafana where to find the dashboard JSON files.

apiVersion: 1

providers:
  - name: "Employee Management System"
    orgId: 1
    folder: "EMS"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
