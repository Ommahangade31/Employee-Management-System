# =============================================================
# Docker Compose – Employee Management System + Monitoring Stack
# =============================================================
#
# Services:
#   app        – Flask application          → http://localhost:5000
#   prometheus – Metrics collection         → http://localhost:9090
#   grafana    – Metrics visualisation      → http://localhost:3000
#
# Quick-start:
#   docker-compose up -d          # start all services in background
#   docker-compose ps             # check container status
#   docker-compose logs -f app    # stream app logs
#   docker-compose down           # stop and remove containers
#   docker-compose down -v        # also delete volumes (DELETES DATABASE)
#   docker-compose up -d --build  # rebuild app image and restart
# =============================================================

version: "3.9"

services:

  # ---- Flask Application ----------------------------------------
  app:
    build: .
    image: employee-management-system:latest
    container_name: ems_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_PATH=/app/data/employees.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - FLASK_DEBUG=false
    volumes:
      # Named volume keeps the SQLite database across container restarts
      - ems_db_data:/app/data
    networks:
      - ems_network
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---- Prometheus -----------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: ems_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - ems_network
    depends_on:
      - app

  # ---- Grafana --------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.3
    container_name: ems_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Tell Grafana where to find its provisioning files
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ems_network
    depends_on:
      - prometheus

# ---- Named Volumes --------------------------------------------
volumes:
  ems_db_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ---- Networks -------------------------------------------------
networks:
  ems_network:
    driver: bridge
